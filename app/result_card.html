<div class="result-card">
    <p class="result-top-label">Jenis Beras Terdeteksi</p>
    <p class="result-species">{label}</p>
    <div class="conf-row">
        <span>Confidence Score</span>
        <span>{confidence:.1f}%</span>
    </div>
    <div class="conf-track">
        <div class="conf-fill" style="width:{confidence:.1f}%;"></div>
    </div>
    <p class="conf-number">{confidence:.1f}%</p>
    {warning}
</div>
